name: Windows build and release

on:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  gui-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python -m ruff check .
      - name: Test actual GUI offline
        run: xvfb-run -a -s "-screen 0 1280x900x24" python tests/gui_smoke.py
        env:
          AGNIA_GUI_SCREENSHOTS: gui-screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: GUI-screenshots
          path: gui-screenshots/*.png
          if-no-files-found: warn
  test-build-smoke:
    needs: gui-test
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run automated tests
        run: python -m pytest

      - name: Static audit
        run: python -m ruff check .

      - name: Compile Python modules
        run: python -m compileall -q app main.py

      - name: Build one-file GUI executable
        run: python -m PyInstaller --clean --noconfirm AgniaBlueskySuite.spec

      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $failure = Join-Path $env:TEMP "agnia-bluesky-smoke-failure.txt"
          $progress = Join-Path $env:TEMP "agnia-bluesky-smoke-progress.txt"
          Remove-Item $failure -ErrorAction SilentlyContinue
          Remove-Item $progress -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath ".\dist\AgniaBlueskySuite.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $process.WaitForExit(60000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $failure) { Get-Content $failure }
            if (Test-Path $progress) { Get-Content $progress }
            throw "Packaged EXE smoke-test timed out after 60 seconds"
          }
          if ($process.ExitCode -ne 0) {
            if (Test-Path $failure) { Get-Content $failure }
            throw "Packaged EXE smoke-test failed with exit code $($process.ExitCode)"
          }
          if (-not (Test-Path $progress)) {
            throw "Packaged EXE smoke-test did not write a completion checkpoint"
          }
          $checkpoint = (Get-Content $progress -Raw).Trim()
          if ($checkpoint -ne "completed") {
            throw "Packaged EXE smoke-test stopped at checkpoint: $checkpoint"
          }

      - name: Create release archive and checksums
        shell: pwsh
        run: |
          $version = (python -c "import app; print(app.__version__)").Trim()
          $bundle = "release\AgniaBlueskySuite"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item "dist\AgniaBlueskySuite.exe" $bundle
          Copy-Item "README.md" $bundle
          Copy-Item "examples\queue_import_example.txt" $bundle
          $archive = "release\AgniaBlueskySuite-v$version-windows-x64.zip"
          Compress-Archive -Path "$bundle\*" -DestinationPath $archive -Force
          $exeHash = (Get-FileHash "dist\AgniaBlueskySuite.exe" -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          @(
            "$exeHash *AgniaBlueskySuite.exe"
            "$zipHash *AgniaBlueskySuite-v$version-windows-x64.zip"
          ) | Set-Content "release\SHA256SUMS.txt" -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: AgniaBlueskySuite-windows-x64
          path: |
            release/AgniaBlueskySuite-v*-windows-x64.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attach assets to GitHub Release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (python -c "import app; print(app.__version__)").Trim()
          gh release upload "${{ github.event.release.tag_name }}" `
            "dist\AgniaBlueskySuite.exe" `
            "release\AgniaBlueskySuite-v$version-windows-x64.zip" `
            "release\SHA256SUMS.txt" --clobber

      - name: Publish verified release on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (python -c "import app; print(app.__version__)").Trim()
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; preserving its assets."
            exit 0
          }
          gh release create $tag --target "${{ github.sha }}" --title "Agnia Bluesky Suite $version" --notes-file "docs/RELEASE_NOTES_1.3.0.md" `
            "dist/AgniaBlueskySuite.exe" `
            "release/AgniaBlueskySuite-v$version-windows-x64.zip" `
            "release/SHA256SUMS.txt"
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
